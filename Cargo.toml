[package]
name = "webp_player"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.29.1"
egui = "0.29.1"
webp-animation = { version = "0.9.0", features = ["image"] }
image = { version = "0.24", default-features = false, features = ["png", "ico", "jpeg"] }
rfd = "0.15"

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1